# Deploys prototype/ to the Vercel project "grand-site-dc" on every push to this branch.
#
# Why Vercel CLI + token instead of the Vercel GitHub App:
# - Hobby plan deploys only commits authored by the Hobby team owner, so teammates' commits would fail.
# - Deploy only prototype/ on seungminyi-byte-prototype, the repository default branch.
#
# Required repository secret: VERCEL_TOKEN
#   Vercel dashboard -> Account Settings -> Tokens -> Create (scope: team "camp it ralph")
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
name: Deploy prototype to Vercel

on:
  push:
    branches: [seungminyi-byte-prototype]
    paths:
      - 'prototype/**'
      - '.github/workflows/vercel-prod.yml'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Project identifiers, not credentials (same values as prototype/.vercel/project.json on a linked machine)
  VERCEL_ORG_ID: team_w0icCjHEBvrGXwIJc0qUyNgo
  VERCEL_PROJECT_ID: prj_4r7CSyabkZncl7lW9BgzUh6x4mnI

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "deployment: $url"
          {
            echo "### Vercel production deployment"
            echo "- Deployment: $url"
            echo "- Production URL: https://grand-site-dc.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
