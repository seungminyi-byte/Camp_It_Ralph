# Deploys prototype/ to the Vercel project "grand-site-dc" on every matching push
# to the repository default branch, prototype.
#
# Why Vercel CLI + token instead of the Vercel GitHub App:
# - Hobby plan deploys only commits authored by the Hobby team owner, so teammates' commits would fail.
# - Deploy only prototype/ on prototype, the repository default branch.
#
# Required repository secret: VERCEL_TOKEN
#   Vercel dashboard -> Account Settings -> Tokens -> Create (scope: team "camp it ralph")
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
name: Deploy prototype to Vercel

on:
  push:
    branches: [prototype]
    paths:
      - 'prototype/**'
      - '.github/workflows/vercel-prod.yml'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Project identifiers, not credentials (same values as prototype/.vercel/project.json on a linked machine)
  VERCEL_ORG_ID: team_w0icCjHEBvrGXwIJc0qUyNgo
  VERCEL_PROJECT_ID: prj_4r7CSyabkZncl7lW9BgzUh6x4mnI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: node node_modules/vitest/vitest.mjs run

      - name: Validate bundled data
        run: python3 ../data-pack/scripts/validate_out.py

      - name: Verify population missing and zero handling
        run: python3 -m unittest discover -s ../data-pack/scripts -p test_p03_population.py

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Check deployment secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Link Vercel project
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project grand-site-dc --token="$VERCEL_TOKEN"

      - name: Pull production project settings
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact
        working-directory: .
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Confirm production deployment is Ready
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token="$VERCEL_TOKEN"
          {
            echo "### Vercel production deployment"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Production URL: https://grand-site-dc.vercel.app"
            echo "- Status: Ready (verified with vercel inspect)"
          } >> "$GITHUB_STEP_SUMMARY"
